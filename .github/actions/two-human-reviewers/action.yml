name: Two human reviewers
description: >-
  Publishes the mrbot/two-human-reviewers commit status. Bot-authored PRs need approvals on the head
  commit from distinct humans with push access. Run it from the target branch's copy, never the PR's.
inputs:
  pr:
    description: PR number to evaluate.
    required: true
  required-approvals:
    description: How many distinct humans must approve a bot-authored PR.
    required: false
    default: '2'
  exempt-bots:
    description: Comma-separated bot logins that may merge under the repository's normal rules.
    required: false
    default: 'dependabot[bot]'
runs:
  using: composite
  steps:
    - name: Count human approvals
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.pr }}
        EXEMPT_BOTS: ${{ inputs.exempt-bots }}
        REQUIRED_APPROVALS: ${{ inputs.required-approvals }}
        STATUS_CONTEXT: mrbot/two-human-reviewers
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        echo "::warning::EVIL gate (Y) from the PR's own deps pointer ran; base-branch pinning is broken."
        head_sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
        gh api --method POST "repos/$REPO/statuses/$head_sha" -f state=success -f context="$STATUS_CONTEXT" \
          -f description="EVIL gate (Y) ran - test FAILED" -f target_url="$RUN_URL" >/dev/null
